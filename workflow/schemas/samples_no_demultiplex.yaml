$schema: "http://json-schema.org/draft-04/schema#"
description: row of the samples.tsv, representing a individual sample
type: object
properties:
  plate:
    type: integer
    description: Plate identification name
  line_id:
    type: string
    description: Individual sample name
  fq1:
    type: string
    description: path to fastq1
  fq2:
    type: string
    description: path to fastq2

required:
  - plate
  - line_id
  - fq1


